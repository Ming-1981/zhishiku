ght=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">P 定位</text><text x=\"500\" y=\"95\" font-size=\"9.5\" fill=\"#C2410C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">在目标客户心智中</text><text x=\"500\" y=\"115\" font-size=\"9.5\" fill=\"#C2410C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">建立差异化认知</text><text x=\"500\" y=\"132\" font-size=\"9.5\" fill=\"#C2410C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">创建独特的价值主张</text><text x=\"195\" y=\"95\" font-size=\"18\" fill=\"#94A3B8\" text-anchor=\"middle\">→</text><text x=\"395\" y=\"95\" font-size=\"18\" fill=\"#94A3B8\" text-anchor=\"middle\">→</text><rect x=\"20\" y=\"155\" width=\"560\" height=\"115\" fill=\"#F5F3FF\" stroke=\"#7C3AED\" stroke-width=\"1\" rx=\"6\"/><text x=\"35\" y=\"178\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#7C3AED\" font-family=\"Microsoft YaHei\">细分变量示例（可组合使用）</text><text x=\"35\" y=\"200\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">📍 地理：区域/城市/气候/人口密度</text><text x=\"35\" y=\"218\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">👤 人口：年龄/性别/收入/教育/职业</text><text x=\"35\" y=\"236\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">🧠 心理：生活方式/价值观/个性</text><text x=\"35\" y=\"254\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">🛒 行为：使用频率/品牌忠诚/购买时机/利益诉求</text><text x=\"300\" y=\"200\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">💡 定位策略：产品属性定位 / 利益定位 / 使用场景定位 / 竞争对手对比定位</text></svg><div class=\"diagram-caption\">STP战略：市场细分→目标选择→差异化定位，三步构建竞争优势</div></div>"}},{"id":"mba-marketing-007","module":"mba","category":"营销战略","title":"4P营销组合理论","subtitle":"产品·价格·渠道·促销","type":"model","situation":"optimization","source":"MBA营销战略","icon":"📦","tags":["营销组合","产品策略","价格策略","渠道策略","促销策略"],"description":"4P是营销的基本工具组合：产品(Product)、价格(Price)、渠道(Place)、促销(Promotion)。","details":{"elements":[{"name":"产品 Product","items":["产品线","产品质量","品牌形象","包装","售后"]},{"name":"价格 Price","items":["定价策略","折扣政策","付款方式","价格敏感度"]},{"name":"渠道 Place","items":["分销渠道","门店选址","物流配送","库存管理"]},{"name":"促销 Promotion","items":["广告","公关","销售促进","人员推销","直接营销"]}]}},{"id":"mba-marketing-008","module":"mba","category":"营销战略","title":"商业模式画布","subtitle":"商业模式分析与设计工具","type":"tool","situation":"optimization","source":"MBA战略管理","icon":"🧱","tags":["商业模式","价值主张","客户关系","盈利模式"],"description":"商业模式画布是一种系统性的商业模式分析工具，包含9个构建块。","details":{"blocks":[{"name":"客户细分","desc":"我们为谁创造价值？谁是我们的核心客户？"},{"name":"价值主张","desc":"我们为客户创造什么样的价值？"},{"name":"渠道通道","desc":"如何触达我们的客户？"},{"name":"客户关系","desc":"与客户建立什么样的关系？"},{"name":"收入来源","desc":"如何从客户那里获得收入？"},{"name":"核心资源","desc":"实现商业模式需要哪些核心资源？"},{"name":"关键业务","desc":"实现商业模式需要哪些关键业务？"},{"name":"重要合作","desc":"谁是我们的重要伙伴？"},{"name":"成本结构","desc":"商业模式运营的成本结构是什么？"}],"steps":[{"n":"1","title":"客户群体 CS","desc":"我们为谁创造价值？谁是我们的核心客户？大众市场/利基市场/细分市场/多边平台？","color":"blue"},{"n":"2","title":"价值主张 VP","desc":"我们为客户解决什么问题？提供什么价值？总成本最低/产品领先/全面解决方案/系统锁定？","color":"green"},{"n":"3","title":"渠道 Channels","desc":"如何触达客户？认知→评估→购买→交付→售后各阶段分别用什么渠道？","color":"purple"},{"n":"4","title":"客户关系 CR","desc":"我们与客户建立什么关系？私人助理/自助服务/社区/共同创造？","color":"orange"},{"n":"5","title":"收入来源 RS","desc":"客户为什么付费？收入模式是什么？资产销售/使用费/订阅费/许可费？定价策略？","color":"teal"},{"n":"6","title":"核心资源 KR","desc":"实现价值主张需要什么核心资源？实体资产/知识资产/人力资源/金融资产？","color":"rose"},{"n":"7","title":"关键活动 KA","desc":"需要做什么关键活动？生产制造/解决方案/平台运营？","color":"gold"},{"n":"8","title":"关键合作 KP","desc":"谁是我们的关键合作伙伴？供应商/战略联盟/生态系统？","color":"slate"},{"n":"9","title":"成本结构 CS","desc":"商业模式中最重要的成本是什么？固定成本/可变成本/规模经济/范围经济？","color":"crimson"}],"tips":"商业模式画布是创业者和经理人的通用语言。建议团队一起填写，重点关注各要素之间的逻辑一致性——特别是价值主张与客户群体、收入来源与客户愿意付费的匹配性。","detail":"商业模式画布由Alexander Osterwalder提出，用9个模块描述企业如何创造、传递和获取价值。相比传统商业计划书，画布更简洁、更可视化、更适合快速迭代和团队讨论。","related":["精益画布","蓝海战略","STP","安索夫矩阵"],"diagram":"<div class=\"diagram-wrap\" style=\"overflow-x:auto;\"><svg viewBox=\"0 0 780 360\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"5\" width=\"145\" height=\"100\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"5\" y=\"5\" width=\"145\" height=\"28\" fill=\"#2563EB\" rx=\"5\"/><text x=\"77\" y=\"23\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">关键合作伙伴 KP</text><text x=\"77\" y=\"60\" font-size=\"9\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">供应商/战略联盟</text><rect x=\"155\" y=\"5\" width=\"145\" height=\"100\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"155\" y=\"5\" width=\"145\" height=\"28\" fill=\"#2563EB\" rx=\"5\"/><text x=\"227\" y=\"23\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">关键活动 KA</text><text x=\"227\" y=\"60\" font-size=\"9\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">生产/解决方案</text><rect x=\"305\" y=\"5\" width=\"145\" height=\"100\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"305\" y=\"5\" width=\"145\" height=\"28\" fill=\"#2563EB\" rx=\"5\"/><text x=\"377\" y=\"23\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">关键资源 KR</text><text x=\"377\" y=\"60\" font-size=\"9\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">实体/知识/人力</text><rect x=\"455\" y=\"5\" width=\"320\" height=\"100\" fill=\"#FFFBEB\" stroke=\"#EA6C0C\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"455\" y=\"5\" width=\"320\" height=\"28\" fill=\"#EA6C0C\" rx=\"5\"/><text x=\"615\" y=\"23\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">价值主张 VP</text><text x=\"615\" y=\"58\" font-size=\"10\" fill=\"#C2410C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">为客户解决什么问题？</text><text x=\"615\" y=\"76\" font-size=\"10\" fill=\"#C2410C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">提供什么独特价值？</text><rect x=\"5\" y=\"115\" width=\"220\" height=\"100\" fill=\"#F0FDF4\" stroke=\"#0D9488\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"5\" y=\"115\" width=\"220\" height=\"28\" fill=\"#0D9488\" rx=\"5\"/><text x=\"115\" y=\"133\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">客户关系 CR</text><text x=\"115\" y=\"165\" font-size=\"9\" fill=\"#0F766E\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">私人助理/自助服务</text><rect x=\"230\" y=\"115\" width=\"220\" height=\"100\" fill=\"#F0FDF4\" stroke=\"#0D9488\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"230\" y=\"115\" width=\"220\" height=\"28\" fill=\"#0D9488\" rx=\"5\"/><text x=\"340\" y=\"133\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">渠道 Channels</text><text x=\"340\" y=\"165\" font-size=\"9\" fill=\"#0F766E\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">认知→评估→购买→交付</text><rect x=\"455\" y=\"115\" width=\"320\" height=\"100\" fill=\"#F0FDF4\" stroke=\"#0D9488\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"455\" y=\"115\" width=\"320\" height=\"28\" fill=\"#0D9488\" rx=\"5\"/><text x=\"615\" y=\"133\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">客户群体 CS</text><text x=\"615\" y=\"165\" font-size=\"9\" fill=\"#0F766E\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">大众/利基/细分/多边</text><rect x=\"455\" y=\"230\" width=\"155\" height=\"125\" fill=\"#FFF1F2\" stroke=\"#DC2626\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"455\" y=\"230\" width=\"155\" height=\"28\" fill=\"#DC2626\" rx=\"5\"/><text x=\"532\" y=\"248\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">成本结构 CS</text><text x=\"532\" y=\"280\" font-size=\"9\" fill=\"#DC2626\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">固定/可变成本</text><rect x=\"620\" y=\"230\" width=\"155\" height=\"125\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1.5\" rx=\"5\"/><rect x=\"620\" y=\"230\" width=\"155\" height=\"28\" fill=\"#16A34A\" rx=\"5\"/><text x=\"697\" y=\"248\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">收入来源 RS</text><text x=\"697\" y=\"280\" font-size=\"9\" fill=\"#16A34A\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">资产/订阅/使用费</text></svg><div class=\"diagram-caption\">商业模式画布：九要素系统描述企业如何创造、传递和获取价值</div></div>"}},{"id":"mba-marketing-009","module":"mba","category":"营销战略","title":"品牌资产模型","subtitle":"CBBE品牌建设框架","type":"model","situation":"optimization","source":"MBA营销战略","icon":"💎","tags":["品牌资产","品牌认知","品牌忠诚","品牌联想"],"description":"凯勒的品牌资产金字塔(CBBE)从品牌认知、品牌意义、品牌反应、品牌关系四个层次构建强势品牌。","details":{"levels":[{"level":"品牌认知","elements":["品牌识别","品牌记忆","品牌熟悉度"]},{"level":"品牌意义","elements":["品牌形象","品牌个性","品牌联想"]},{"level":"品牌反应","elements":["品牌判断","品牌质量","品牌信誉"]},{"level":"品牌关系","elements":["品牌共鸣","行为忠诚","态度忠诚","社区归属"]}]}},{"id":"mba-product-three-layers","module":"mba","category":"营销战略","title":"产品三层模型","subtitle":"核心产品·形式产品·延伸产品","type":"model","situation":"optimization","source":"MBA营销战略","icon":"🎁","tags":["产品策略","产品层次","核心利益"],"description":"产品三层模型将产品分为核心产品、形式产品、延伸产品三个层次，帮助企业理解产品的完整价值构成。","details":{"layers":[{"name":"核心产品","desc":"顾客真正购买的基本效用或利益，是产品的灵魂","example":"相机的核心是'留下美好记忆'"},{"name":"形式产品","desc":"核心产品的载体，包括功能、特色、品牌、包装、质量"},{"name":"延伸产品","desc":"购买获得的附加服务和利益，包括售后、安装、保证"}],"steps":[{"n":"核心","title":"核心产品 Core Product","desc":"消费者购买产品真正追求的基本利益或效用（不是产品本身，而是'解决问题'）。核心问题：顾客真正买的是什么？","color":"orange"},{"n":"实体","title":"实体产品 Physical Product","desc":"核心利益的具体载体：品质、特征、设计、品牌名称、包装。实体产品必须实现核心利益，而非仅仅是名义上的存在","color":"blue"},{"n":"附加","title":"附加产品 Augmented Product","desc":"超出基本期望的附加利益：担保、售后服务、交付安排、信贷条件、合作伙伴关系。附加产品往往是差异化竞争的关键","color":"purple"}],"tips":"产品竞争的最高形式是核心利益的竞争。附加产品的差异化最容易模仿，真正的持久竞争优势来自于实体产品设计（如果是差异化技术）和核心产品（如果是独特价值主张）。","detail":"产品三层次理论由菲利普·科特勒提出，将产品分为核心利益、实体产品和附加产品三个层次。这个框架帮助营销人员理解：消费者购买的不是产品本身，而是产品带来的利益；产品竞争不仅是功能竞争，而是价值层次的全方位竞争。","related":["商业模式画布","消费者7问","马斯洛需求"]}},{"id":"mba-om-001","module":"mba","category":"运营管理","title":"精益生产(Lean Production)","subtitle":"消除浪费、创造价值","type":"method","situation":"optimization","source":"MBA运营管理","icon":"🏭","tags":["精益生产","TPS","丰田生产系统","价值创造"],"description":"精益生产的核心是消除一切浪费(Muda)，通过持续改善实现用更少的投入创造更大的价值。","details":{"principles":[{"name":"价值","desc":"从客户角度定义价值"},{"name":"价值流","desc":"识别和消除不增值的浪费"},{"name":"流动","desc":"让价值持续流动"},{"name":"拉动","desc":"按客户需求拉动生产"},{"name":"尽善尽美","desc":"持续追求完美"}],"wastes":["过量生产","等待","运输","过度加工","库存","动作","不良品"]}},{"id":"mba-dupont","module":"mba","category":"财务分析","title":"杜邦分析体系","subtitle":"ROE分解与盈利能力诊断","type":"model","situation":"internal","source":"MBA财务管理","icon":"💹","tags":["杜邦分析","ROE","盈利能力","财务杠杆"],"description":"杜邦分析将ROE分解为销售净利率、总资产周转率、权益乘数三个相乘的因素，诊断企业盈利能力的真正来源。","details":{"formula":"ROE = 销售净利率 × 总资产周转率 × 权益乘数","decomposition":[{"name":"销售净利率","formula":"净利润 ÷ 销售收入","insight":"反映每1元收入带来多少净利润"},{"name":"总资产周转率","formula":"销售收入 ÷ 总资产","insight":"反映资产利用效率"},{"name":"权益乘数","formula":"总资产 ÷ 所有者权益","insight":"反映财务杠杆水平"}],"steps":[{"n":"1","title":"净资产收益率 ROE","desc":"ROE = 净利润 ÷ 所有者权益，反映股东投资回报率，是综合性最强的盈利指标","color":"green"},{"n":"2","title":"销售净利率","desc":"净利润 ÷ 销售收入，反映每1元收入带来多少净利润。驱动因素：毛利率、期间费用率、税负","color":"blue"},{"n":"3","title":"总资产周转率","desc":"销售收入 ÷ 总资产，反映资产利用效率。驱动因素：存货周转、应收账款周转、固定资产利用率","color":"orange"},{"n":"4","title":"权益乘数","desc":"总资产 ÷ 所有者权益，反映财务杠杆水平。驱动因素：资产负债率、债务结构","color":"purple"}],"tips":"杜邦分析的核心是找到ROE的驱动因素：净利率×资产周转率×财务杠杆。三个因素中哪一个是企业的短板，就是改进的重点。","detail":"杜邦分析体系是20世纪初由杜邦公司工程师创建的财务分析框架，它将ROE分解为三个相乘的因素，揭示了企业盈利能力的真正来源。这种分解让我们能识别出'为什么同样的ROE背后是不同的能力'。","related":["财务报表分析","NPV_IRR","边际分析"],"diagram":"<div class=\"diagram-wrap\"><svg viewBox=\"0 0 580 340\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"190\" y=\"10\" width=\"200\" height=\"50\" fill=\"#0F2C4A\" rx=\"8\"/><text x=\"290\" y=\"28\" font-size=\"14\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">净资产收益率 ROE</text><text x=\"290\" y=\"78\" font-size=\"16\" font-weight=\"bold\" fill=\"#0F2C4A\" text-anchor=\"middle\">=</text><rect x=\"20\" y=\"95\" width=\"170\" height=\"110\" fill=\"white\" stroke=\"#2563EB\" stroke-width=\"2\" rx=\"8\"/><rect x=\"20\" y=\"95\" width=\"170\" height=\"32\" fill=\"#2563EB\" rx=\"8\"/><text x=\"105\" y=\"115\" font-size=\"10.5\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">销售净利率</text><text x=\"105\" y=\"140\" font-size=\"11\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">净利润 ÷ 收入</text><text x=\"105\" y=\"162\" font-size=\"9.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">反映盈利能力</text><text x=\"205\" y=\"150\" font-size=\"18\" font-weight=\"bold\" fill=\"#64748B\" text-anchor=\"middle\">×</text><rect x=\"220\" y=\"95\" width=\"140\" height=\"110\" fill=\"white\" stroke=\"#0D9488\" stroke-width=\"2\" rx=\"8\"/><rect x=\"220\" y=\"95\" width=\"140\" height=\"32\" fill=\"#0D9488\" rx=\"8\"/><text x=\"290\" y=\"115\" font-size=\"10.5\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">总资产周转率</text><text x=\"290\" y=\"140\" font-size=\"11\" fill=\"#0F766E\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">收入 ÷ 总资产</text><text x=\"290\" y=\"162\" font-size=\"9.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">反映运营效率</text><text x=\"375\" y=\"150\" font-size=\"18\" font-weight=\"bold\" fill=\"#64748B\" text-anchor=\"middle\">×</text><rect x=\"390\" y=\"95\" width=\"170\" height=\"110\" fill=\"white\" stroke=\"#EA6C0C\" stroke-width=\"2\" rx=\"8\"/><rect x=\"390\" y=\"95\" width=\"170\" height=\"32\" fill=\"#EA6C0C\" rx=\"8\"/><text x=\"475\" y=\"115\" font-size=\"10.5\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">权益乘数</text><text x=\"475\" y=\"140\" font-size=\"11\" fill=\"#C2410C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">总资产 ÷ 所有者权益</text><text x=\"475\" y=\"162\" font-size=\"9.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">反映财务杠杆</text><text x=\"290\" y=\"218\" font-size=\"20\" fill=\"#0F2C4A\" text-anchor=\"middle\">↓</text><rect x=\"20\" y=\"230\" width=\"540\" height=\"90\" fill=\"#F1F5F9\" stroke=\"#CBD5E1\" stroke-width=\"1\" rx=\"8\"/><text x=\"40\" y=\"253\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#0F2C4A\" font-family=\"Microsoft YaHei\">杜邦分析核心逻辑</text><text x=\"40\" y=\"280\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">• 纵向比较：与自身历史ROE对比，观察改善或恶化趋势</text><text x=\"40\" y=\"298\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">• 横向对标：与行业平均水平或竞争对手对比，找出差距来源</text><text x=\"40\" y=\"316\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">• 因素分解：找到ROE的短板因素，是净利率、周转率还是杠杆</text></svg><div class=\"diagram-caption\">杜邦分析：ROE = 净利率 × 资产周转率 × 财务杠杆，三因素共同驱动股东回报</div></div>"}},{"id":"mba-npv-irr","module":"mba","category":"财务分析","title":"NPV与IRR投资评估","subtitle":"资本预算决策方法","type":"method","situation":"optimization","source":"MBA财务管理","icon":"💰","tags":["NPV","IRR","投资决策","资本预算"],"description":"NPV和IRR是评估投资项目的两个核心指标，NPV衡量绝对价值，IRR衡量相对收益率。","details":{"npv":[{"name":"NPV公式","formula":"NPV = Σ(Ct / (1+r)^t) - C0"},{"name":"判断标准","rule":"NPV > 0：项目可行，增加股东价值"}],"irr":[{"name":"IRR定义","formula":"使 NPV = 0 的折现率"},{"name":"判断标准","rule":"IRR > 资本成本：项目可行"}],"steps":[{"n":"NPV","title":"净现值 Net Present Value","desc":"NPV = Σ(现金流入现值) - 初始投资。NPV>0：项目可行，增加股东财富。NPV<0：项目不可行。核心思想：未来现金流的今天价值","color":"blue"},{"n":"IRR","title":"内部收益率 Internal Rate of Return","desc":"IRR = 使NPV=0的折现率。IRR>资本成本：项目可行。IRR<资本成本：项目不可行。比较多个项目时，IRR高不一定更好（规模效应）","color":"purple"},{"n":"应用","title":"决策应用","desc":"独立项目：NPV>0或IRR>资本成本即可。互斥项目：选NPV最大者（非IRR最高者）。NPV法考虑了项目规模和时间价值，是首选方法","color":"green"},{"n":"注意","title":"注意事项","desc":"1.折现率（资本成本）的选择至关重要 2.要考虑现金流的时间分布 3.项目末期残值要纳入计算 4.NPV和IRR在独立项目和互斥项目上可能给出不同结论","color":"orange"}],"tips":"NPV是评估投资项目的首选方法，因为它直接衡量了项目对股东财富的贡献。IRR虽然直观，但当现金流分布异常或项目规模不同时，可能产生误导。","detail":"NPV（净现值）和IRR（内部收益率）是资本预算中最核心的两个指标。NPV代表项目创造（或毁灭）的绝对财富，IRR代表项目内部的回报率水平。两种方法在独立项目评估上结论一致，但在互斥项目（只能选一个）上可能产生分歧，此时应以NPV为准。","formula":"NPV = Σ(CFt / (1+r)^t) - I₀\nIRR: NPV = 0 时的 r 值\n其中：CFt=第t年现金流，r=资本成本，I₀=初始投资","related":["杜邦分析","财务报表分析","边际分析"],"diagram":"<div class=\"diagram-wrap\"><svg viewBox=\"0 0 580 260\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"10\" y=\"10\" width=\"240\" height=\"80\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"130\" y=\"30\" font-size=\"11\" font-weight=\"bold\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">📊 NPV 净现值法</text><text x=\"130\" y=\"50\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">NPV = Σ (CI - CO) / (1+r)^t</text><text x=\"130\" y=\"70\" font-size=\"9\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">CI=现金流入 CO=现金流出 r=折现率 t=年份</text><text x=\"130\" y=\"86\" font-size=\"9\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">NPV>0 → 项目可行 | NPV越大越好</text><rect x=\"270\" y=\"10\" width=\"300\" height=\"80\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"420\" y=\"30\" font-size=\"11\" font-weight=\"bold\" fill=\"#15803D\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">📈 IRR 内部收益率法</text><text x=\"420\" y=\"50\" font-size=\"10\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">NPV=0时的折现率 → IRR</text><text x=\"420\" y=\"70\" font-size=\"9\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">使项目NPV=0的收益率</text><text x=\"420\" y=\"86\" font-size=\"9\" fill=\"#15803D\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">IRR > 资本成本 → 项目可行</text><rect x=\"10\" y=\"105\" width=\"560\" height=\"145\" fill=\"#F1F5F9\" stroke=\"#CBD5E1\" stroke-width=\"1\" rx=\"6\"/><text x=\"20\" y=\"125\" font-size=\"11\" font-weight=\"bold\" fill=\"#0F2C4A\" font-family=\"Microsoft YaHei\">💡 决策标准对比</text><text x=\"20\" y=\"150\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">• NPV法：考虑货币时间价值，绝对值指标，适合独立项目比较</text><text x=\"20\" y=\"170\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">• IRR法：相对收益率指标，适合与资本成本率对比，可能有多个解</text><text x=\"20\" y=\"190\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">• NPV和IRR结论冲突时：优先采用NPV法（更可靠）</text><text x=\"20\" y=\"210\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">• 回收期法：简单但忽略货币时间价值，适合初筛快速判断</text><text x=\"20\" y=\"232\" font-size=\"9\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">注：NPV法假设现金按相同折现率再投资；IRR法假设现金按IRR再投资，实际中NPV假设更合理</text></svg><div class=\"diagram-caption\">NPV-IRR投资决策：两个核心指标结合使用，NPV判断绝对收益，IRR判断相对收益率</div></div>"}},{"id":"mba-decision-tree","module":"mba","category":"决策分析","title":"决策树分析","subtitle":"不确定条件下的结构化决策","type":"tool","situation":"optimization","source":"MBA数据统计与决策","icon":"🌲","tags":["决策树","期望值","风险分析"],"description":"决策树通过树状图展示不同决策方案在不同自然状态下的结果，计算各方案的期望值支持风险决策。","details":{"components":[{"name":"□ 决策节点","desc":"表示需要选择的决策点"},{"name":"○ 机会节点","desc":"表示不确定的随机事件"},{"name":"△ 结果节点","desc":"表示最终结果"}],"calculation":[{"step":"1","desc":"从右向左计算各机会节点的期望值"},{"step":"2","desc":"期望值 = Σ(概率 × 收益值)"},{"step":"3","desc":"在各决策节点选择期望值最大的方案"}],"steps":[{"n":"□","title":"决策节点 Decision Node","desc":"用□表示，决策者可以选择不同行动方案。每个分支代表一个行动方案","color":"blue"},{"n":"○","title":"机会节点 Chance Node","desc":"用○表示，各分支代表不同结果及发生概率。各分支概率之和=1","color":"orange"},{"n":"3","title":"计算期望值 EV","desc":"机会节点：EV = Σ(概率 × 结果值)。从叶子节点向上计算","color":"purple"},{"n":"✂","title":"剪枝（选择）","desc":"决策节点：选择期望值最高（最低成本）的分支。比较不同决策路径的EV，选择最优","color":"green"}],"tips":"决策树的价值在于将复杂的决策问题可视化、逻辑化。关键输入是各结果的概率和价值估计——这些需要结合历史数据或专家判断。敏感性分析可以检验结论对关键假设的依赖程度。","detail":"决策树是处理不确定性和序列决策的标准工具，特别适合'先做什么测试再决定'这类两阶段决策问题。贝叶斯方法可以与决策树结合，在获得新信息后更新概率判断。","formula":"期望值 EV = Σ( Pi × Vi )\n其中：Pi=第i个结果的概率，Vi=第i个结果的价值\n风险调整：EV × 风险权重 = 风险调整价值","related":["贝叶斯分析","灵敏度分析","线性规划"],"diagram":"<div class=\"diagram-wrap\"><svg viewBox=\"0 0 580 300\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"230\" y=\"10\" width=\"120\" height=\"46\" fill=\"#0F2C4A\" rx=\"23\"/><text x=\"290\" y=\"30\" font-size=\"11\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">决策 D</text><text x=\"290\" y=\"47\" font-size=\"9\" fill=\"#93C5FD\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">选A还是选B?</text><line x1=\"260\" y1=\"56\" x2=\"150\" y2=\"95\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><text x=\"195\" y=\"75\" font-size=\"9\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">方案A</text><line x1=\"320\" y1=\"56\" x2=\"430\" y2=\"95\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><text x=\"385\" y=\"75\" font-size=\"9\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">方案B</text><circle cx=\"140\" cy=\"110\" r=\"35\" fill=\"#FFFBEB\" stroke=\"#EA6C0C\" stroke-width=\"2\"/><text x=\"140\" y=\"105\" font-size=\"10\" font-weight=\"bold\" fill=\"#EA6C0C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">机会 O</text><circle cx=\"440\" cy=\"110\" r=\"35\" fill=\"#FFFBEB\" stroke=\"#EA6C0C\" stroke-width=\"2\"/><text x=\"440\" y=\"105\" font-size=\"10\" font-weight=\"bold\" fill=\"#EA6C0C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">机会 O</text><line x1=\"115\" y1=\"145\" x2=\"60\" y2=\"185\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><text x=\"82\" y=\"162\" font-size=\"8.5\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">好60%</text><rect x=\"10\" y=\"188\" width=\"100\" height=\"40\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"60\" y=\"206\" font-size=\"9\" fill=\"#15803D\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">EV=+50万</text><text x=\"60\" y=\"220\" font-size=\"8\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">60%×50=30万</text><line x1=\"165\" y1=\"145\" x2=\"220\" y2=\"185\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><text x=\"198\" y=\"162\" font-size=\"8.5\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">差40%</text><rect x=\"170\" y=\"188\" width=\"100\" height=\"40\" fill=\"#FFF1F2\" stroke=\"#DC2626\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"220\" y=\"206\" font-size=\"9\" fill=\"#DC2626\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">EV=-20万</text><text x=\"220\" y=\"220\" font-size=\"8\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">40%×(-20)=-8万</text><line x1=\"415\" y1=\"145\" x2=\"370\" y2=\"185\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><text x=\"388\" y=\"162\" font-size=\"8.5\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">好70%</text><rect x=\"320\" y=\"188\" width=\"100\" height=\"40\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"370\" y=\"206\" font-size=\"9\" fill=\"#15803D\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">EV=+80万</text><text x=\"370\" y=\"220\" font-size=\"8\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">70%×80=56万</text><line x1=\"465\" y1=\"145\" x2=\"520\" y2=\"185\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><text x=\"498\" y=\"162\" font-size=\"8.5\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">差30%</text><rect x=\"480\" y=\"188\" width=\"90\" height=\"40\" fill=\"#FFF1F2\" stroke=\"#DC2626\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"525\" y=\"206\" font-size=\"9\" fill=\"#DC2626\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">EV=-10万</text><text x=\"525\" y=\"220\" font-size=\"8\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">30%×(-10)=-3万</text><rect x=\"30\" y=\"262\" width=\"160\" height=\"34\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"110\" y=\"279\" font-size=\"10\" font-weight=\"bold\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">方案A EV=+22万</text><rect x=\"220\" y=\"262\" width=\"300\" height=\"34\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1.5\" rx=\"6\"/><text x=\"370\" y=\"279\" font-size=\"10\" font-weight=\"bold\" fill=\"#15803D\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">方案B EV=+53万 ✅ 优选</text></svg><div class=\"diagram-caption\">决策树：可视化序列决策，从叶子节点向上计算期望值(EV)，选择最高EV路径</div></div>"}},{"id":"mba-pert-cpm","module":"mba","category":"项目管理","title":"PERT/CPM项目管理","subtitle":"项目进度规划与关键路径分析","type":"method","situation":"optimization","source":"MBA数据统计与决策","icon":"📅","tags":["PERT","CPM","关键路径","项目进度"],"description":"PERT用三点估计法处理不确定性，CPM通过关键路径分析优化项目工期。","details":{"pert":[{"name":"三点估计法","formula":"Te = (O + 4M + P) / 6"},{"name":"标准差","formula":"σ = (P - O) / 6"}],"cpm":[{"name":"关键路径","desc":"项目中耗时最长的活动序列，决定项目最短完成时间"},{"name":"总时差","desc":"活动可以延迟但不影响项目总工期的最大时间"}],"steps":[{"n":"1","title":"活动分解","desc":"将项目分解为独立活动，识别活动间的紧前关系（哪些必须先完成）","color":"blue"},{"n":"2","title":"三点估算","desc":"对每项活动估计：O=乐观时间、M=最可能时间、P=悲观时间。期望时间Te = (O+4M+P)/6","color":"green"},{"n":"3","title":"找关键路径","desc":"关键路径 = 项目网络图中最长的路径（决定项目最短完成时间）。关键路径上的活动没有时间弹性","color":"orange"},{"n":"4","title":"项目压缩","desc":"关键路径压缩：将关键活动加速（赶工）或并行作业（快速跟进）。压缩成本 vs 压缩时间收益的比较","color":"purple"}],"tips":"关键路径上的任何延误都会导致整个项目延误。非关键路径上的活动有'总时差'——可以延误而不影响项目完成时间。项目管理软件（如MS Project）是实施PERT/CPM的有效工具。","detail":"PERT（Program Evaluation and Review Technique）和CPM（Critical Path Method）于1950年代分别由美国海军和杜邦公司开发，是现代项目管理的基石。两者核心思想相同，区别在于：PERT用三点估计处理不确定性，CPM用单一时间估计处理确定性活动。","formula":"期望时间 Te = (O + 4M + P) / 6\n方差 Var = [(P - O) / 6]²\n项目完工概率：在关键路径总Te±Z×√(总Var)范围内","related":["决策树","线性规划","库存模型"]}},{"id":"mba-eoq","module":"mba","category":"运营管理","title":"EOQ经济订货批量","subtitle":"最优订货量计算模型","type":"model","situation":"optimization","source":"MBA数据统计与决策","icon":"📦","tags":["EOQ","经济批量","库存管理"],"description":"EOQ模型通过平衡订货成本和持有成本，确定最优订货批量，使总库存成本最小化。","details":{"formula":"EOQ = √(2DS/H)","variables":[{"name":"D","desc":"年需求量"},{"name":"S","desc":"每次订货成本"},{"name":"H","desc":"单位持有成本"}],"steps":[{"n":"EOQ","title":"经济订货量公式","desc":"EOQ = √(2DS/H)。D=年需求量，S=每次订货成本，H=单位持有成本/年。经济订货量使订货成本和持有成本之和最小","color":"purple"},{"n":"TOC","title":"总持有成本","desc":"年持有成本 = 平均库存量 × 单位持有成本 = (EOQ/2) × H","color":"blue"},{"n":"TSC","title":"总订货成本","desc":"年订货成本 = 订货次数 × 每次订货成本 = (D/EOQ) × S","color":"orange"},{"n":"ROP","title":"再订货点 ROP","desc":"ROP = 日需求量 × 补货周期（Lead Time）。当库存降至ROP时触发订货。考虑安全库存应对需求波动","color":"green"}],"tips":"EOQ模型假设需求恒定、订货成本固定、持有成本与库存线性相关。现实中需求波动、批量折扣、供应商MOQ等会使问题复杂化，需要扩展模型。","detail":"EOQ（Economic Order Quantity）模型由F.W. Harris于1913年提出，是库存管理的基础模型。其核心思想是：订货成本随订货频率增加而增加（规模经济），持有成本随订货量增加而增加，两者平衡点即为最优订货量。","related":["线性规划","网络模型","决策树"],"diagram":"<div class=\"diagram-wrap\"><svg viewBox=\"0 0 580 300\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"50\" y1=\"250\" x2=\"550\" y2=\"250\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"250\" x2=\"50\" y2=\"30\" stroke=\"#CBD5E1\" stroke-width=\"1.5\"/><text x=\"55\" y=\"25\" font-size=\"10\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">成本</text><text x=\"535\" y=\"268\" font-size=\"10\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">订货量 Q →</text><path d=\"M60,60 Q200,220 290,230 Q380,240 540,120\" stroke=\"#0F2C4A\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M60,230 Q200,150 290,120 Q380,95 540,70\" stroke=\"#EA6C0C\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"6,3\"/><path d=\"M60,60 Q200,95 290,120 Q380,160 540,200\" stroke=\"#2563EB\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"6,3\"/><line x1=\"290\" y1=\"40\" x2=\"290\" y2=\"250\" stroke=\"#16A34A\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/><circle cx=\"290\" cy=\"225\" r=\"5\" fill=\"#16A34A\"/><text x=\"298\" y=\"218\" font-size=\"9.5\" font-weight=\"bold\" fill=\"#16A34A\" font-family=\"Microsoft YaHei\">Q* = EOQ</text><rect x=\"10\" y=\"10\" width=\"220\" height=\"55\" fill=\"#F1F5F9\" stroke=\"#CBD5E1\" stroke-width=\"1\" rx=\"5\"/><text x=\"20\" y=\"28\" font-size=\"10\" font-weight=\"bold\" fill=\"#0F2C4A\" font-family=\"Microsoft YaHei\">📐 EOQ 公式</text><text x=\"20\" y=\"47\" font-size=\"10.5\" fill=\"#334155\" font-family=\"Georgia\">Q* = √(2DS / H)</text><text x=\"20\" y=\"62\" font-size=\"8.5\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">D=年需求 S=订货成本 H=单位持有成本/年</text><rect x=\"250\" y=\"268\" width=\"300\" height=\"28\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1\" rx=\"4\"/><text x=\"400\" y=\"284\" font-size=\"9.5\" fill=\"#15803D\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">最优订货量Q*：持有成本 = 订货成本，两项之和最小</text></svg><div class=\"diagram-caption\">EOQ经济订货量：订货成本和持有成本的平衡点即为最优订货量</div></div>"}},{"id":"mba-motivation","module":"mba","category":"组织行为","title":"激励理论","subtitle":"员工动机与绩效管理","type":"model","situation":"people","source":"MBA组织行为学","icon":"🎯","tags":["激励理论","马斯洛","双因素","期望理论"],"description":"激励理论研究如何激发员工工作动机，主要包括马斯洛需求层次理论、双因素理论、期望理论等。","details":{"maslow":[{"level":"自我实现","desc":"个人成长、潜能发挥"},{"level":"尊重需求","desc":"自尊、被认可、社会地位"},{"level":"社交需求","desc":"归属感、爱与被爱"},{"level":"安全需求","desc":"人身安全、健康保障"},{"level":"生理需求","desc":"食物、水、睡眠等基本需求"}],"herzberg":[{"name":"保健因素","desc":"公司政策、工资、工作环境——没有不满 ≠ 满意"},{"name":"激励因素","desc":"成就、认可、责任、发展——带来真正的满意"}],"steps":[{"n":"马斯","title":"马斯洛需求层次","desc":"生理→安全→社交→尊重→自我实现。低层需求满足后才会追求高层需求。管理者应根据员工需求层次设计激励","color":"blue"},{"n":"双因","title":"赫茨伯格双因素理论","desc":"保健因素（工资、工作条件、公司政策）：没有则不满，有也不一定满意 | 激励因素（成就、认可、成长）：带来真正满意","color":"purple"},{"n":"公平","title":"公平理论 Adams","desc":"员工比较自己与他人的投入产出比（横向），也与自己过去比较（纵向）。不公平感→降低投入或离开组织","color":"orange"},{"n":"强化","title":"强化理论 Skinner","desc":"正强化：奖励期望行为（表扬/奖励）| 负强化：消除不期望行为（批评/惩罚）| 消退：忽略不期望行为","color":"green"}],"tips":"不同员工、不同职业阶段，激励因素优先级不同。金钱对低收入员工是保健因素，对高收入员工可能只是保健因素。真正的激励因素往往是成就感和认可。","detail":"四大激励理论各有侧重：马斯洛描述需求层次结构，双因素解释工作满意与不满意的来源不同，公平理论关注相对报酬的激励效果，强化理论关注行为后果对行为的塑造。实践中应综合运用。","formula":"公平理论公式：\n投入比 = 产出比\n(自己的投入/自己的产出) vs (他人的投入/他人的产出)\n不公平感强度 = (自己的投入/产出) - (他人的投入/产出)","related":["领导理论","胜任力模型","OKR_KPI"],"diagram":"<div class=\"diagram-wrap\"><svg viewBox=\"0 0 700 280\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"5\" width=\"160\" height=\"40\" fill=\"#0F2C4A\" rx=\"5\"/><text x=\"85\" y=\"22\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">理论</text><rect x=\"170\" y=\"5\" width=\"260\" height=\"40\" fill=\"#0F2C4A\" rx=\"5\"/><text x=\"300\" y=\"22\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">核心观点</text><rect x=\"435\" y=\"5\" width=\"260\" height=\"40\" fill=\"#0F2C4A\" rx=\"5\"/><text x=\"565\" y=\"22\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">管理应用</text><rect x=\"5\" y=\"50\" width=\"160\" height=\"52\" fill=\"#F5F3FF\" stroke=\"#7C3AED\" stroke-width=\"1\" rx=\"4\"/><text x=\"85\" y=\"70\" font-size=\"10\" font-weight=\"bold\" fill=\"#7C3AED\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">马斯洛</text><text x=\"85\" y=\"85\" font-size=\"8.5\" fill=\"#6D28D9\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">需求层次</text><rect x=\"170\" y=\"50\" width=\"260\" height=\"52\" fill=\"#F5F3FF\" stroke=\"#7C3AED\" stroke-width=\"1\" rx=\"4\"/><text x=\"300\" y=\"70\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">低层满足后才追求高层需求</text><text x=\"300\" y=\"86\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">生理→安全→社交→尊重→自我实现</text><rect x=\"435\" y=\"50\" width=\"260\" height=\"52\" fill=\"#F5F3FF\" stroke=\"#7C3AED\" stroke-width=\"1\" rx=\"4\"/><text x=\"565\" y=\"70\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">诊断员工需求层次，对症下药</text><text x=\"565\" y=\"86\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">低收入：钱是激励 | 高收入：成就更重要</text><rect x=\"5\" y=\"107\" width=\"160\" height=\"52\" fill=\"#FFFBEB\" stroke=\"#EA6C0C\" stroke-width=\"1\" rx=\"4\"/><text x=\"85\" y=\"127\" font-size=\"10\" font-weight=\"bold\" fill=\"#EA6C0C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">赫茨伯格</text><text x=\"85\" y=\"142\" font-size=\"8.5\" fill=\"#C2410C\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">双因素</text><rect x=\"170\" y=\"107\" width=\"260\" height=\"52\" fill=\"#FFFBEB\" stroke=\"#EA6C0C\" stroke-width=\"1\" rx=\"4\"/><text x=\"300\" y=\"127\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">保健因素：无则不满，有不一定满意</text><text x=\"300\" y=\"143\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">激励因素：带来真正满意和动力</text><rect x=\"435\" y=\"107\" width=\"260\" height=\"52\" fill=\"#FFFBEB\" stroke=\"#EA6C0C\" stroke-width=\"1\" rx=\"4\"/><text x=\"565\" y=\"127\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">不能只靠钱，要给成就感和认可</text><text x=\"565\" y=\"143\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">工资是保健因素，表彰是激励因素</text><rect x=\"5\" y=\"164\" width=\"160\" height=\"52\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1\" rx=\"4\"/><text x=\"85\" y=\"184\" font-size=\"10\" font-weight=\"bold\" fill=\"#16A34A\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">亚当斯</text><text x=\"85\" y=\"199\" font-size=\"8.5\" fill=\"#15803D\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">公平理论</text><rect x=\"170\" y=\"164\" width=\"260\" height=\"52\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1\" rx=\"4\"/><text x=\"300\" y=\"184\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">员工比较投入产出比（横向+纵向）</text><text x=\"300\" y=\"200\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">不公平感→降低投入或离开</text><rect x=\"435\" y=\"164\" width=\"260\" height=\"52\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1\" rx=\"4\"/><text x=\"565\" y=\"184\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">薪酬公开透明，内部公平性优先</text><text x=\"565\" y=\"200\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">定期做薪酬满意度调查</text><rect x=\"5\" y=\"221\" width=\"160\" height=\"52\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1\" rx=\"4\"/><text x=\"85\" y=\"241\" font-size=\"10\" font-weight=\"bold\" fill=\"#2563EB\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">斯金纳</text><text x=\"85\" y=\"256\" font-size=\"8.5\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">强化理论</text><rect x=\"170\" y=\"221\" width=\"260\" height=\"52\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1\" rx=\"4\"/><text x=\"300\" y=\"241\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">行为后果塑造行为</text><text x=\"300\" y=\"257\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">正强化/负强化/惩罚/消退</text><rect x=\"435\" y=\"221\" width=\"260\" height=\"52\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1\" rx=\"4\"/><text x=\"565\" y=\"241\" font-size=\"9.5\" fill=\"#334155\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">及时奖励期望行为，忽略不期望行为</text><text x=\"565\" y=\"257\" font-size=\"8.5\" fill=\"#64748B\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">OKR达成即表彰，不要等年终</text></svg><div class=\"diagram-caption\">四大激励理论对比：理解员工\"为什么工作\"的不同视角和对应的管理行动</div></div>"}},{"id":"mba-leadership","module":"mba","category":"组织行为","title":"领导理论","subtitle":"领导风格与领导力发展","type":"model","situation":"people","source":"MBA组织行为学","icon":"👔","tags":["领导理论","领导风格","权变理论"],"description":"领导理论研究领导者的特质、行为和风格，以及在不同情境下如何有效领导。","details":{"trait":[{"name":"特质理论","desc":"识别领导者具有的共同特质（自信、智慧、果断等）"}],"style":[{"name":"专制型","desc":"决策权集中于领导者，员工服从"},{"name":"民主型","desc":"员工参与决策，领导者促进协作"},{"name":"放任型","desc":"领导者给予员工高度自主权"}],"contingency":[{"name":"菲德勒模型","desc":"领导效果取决于领导风格与情境的匹配度"},{"name":"路径-目标理论","desc":"领导者应帮助员工明确目标、实现路径"}],"steps":[{"n":"勒温","title":"勒温领导风格","desc":"专制型：决策集中，下属执行 | 民主型：成员参与讨论决策 | 放任型：给予充分自由，几乎不指导。研究：民主型领导效果最好（但效率可能较低）","color":"blue"},{"n":"菲德勒","title":"菲德勒权变模型","desc":"领导风格：任务导向 vs 关系导向（由LPC量表测定）。情境因素：领导者-成员关系、任务结构、职位权力。匹配：任务导向在极端情境（很好/很差）下更有效","color":"purple"},{"n":"情景","title":"情景领导理论 Hersey-Blanchard","desc":"领导风格应与下属成熟度匹配：S1指挥式（低成熟）→S2教练式→S3参与式→S4授权式（高成熟）。成熟度：工作成熟度+心理成熟度","color":"green"},{"n":"LMX","title":"LMX领导-成员交换","desc":"领导者与不同下属建立不同质量的关系：内群体（高质量交换：信任、尊重、互惠）vs 外群体（低质量交换：合同式关系）","color":"orange"}],"tips":"没有'最好'的领导风格，只有'最适合'的领导风格。菲德勒提醒我们先了解自己的领导风格，再选择匹配的情境。情景领导则告诉我们要根据下属的发展阶段调整领导方式。","detail":"领导理论经历了从特质论（领导有某些特质）→行为论（领导有某些行为模式）→权变论（领导效果取决于情境）的演进。现代领导理论还包括了交易型领导、变革型领导、仆人式领导等多种视角。","related":["激励理论","团队理论","组织变革"],"diagram":"<div class=\"diagram-wrap\"><svg viewBox=\"0 0 700 240\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"5\" width=\"165\" height=\"100\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1.5\" rx=\"6\"/><rect x=\"5\" y=\"5\" width=\"165\" height=\"28\" fill=\"#2563EB\" rx=\"6\"/><text x=\"87\" y=\"22\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">勒温领导风格</text><text x=\"87\" y=\"55\" font-size=\"9.5\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">专制型：决策集中</text><text x=\"87\" y=\"72\" font-size=\"9.5\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">民主型：成员参与</text><text x=\"87\" y=\"89\" font-size=\"9.5\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">放任型：充分自由</text><rect x=\"178\" y=\"5\" width=\"165\" height=\"100\" fill=\"#F5F3FF\" stroke=\"#7C3AED\" stroke-width=\"1.5\" rx=\"6\"/><rect x=\"178\" y=\"5\" width=\"165\" height=\"28\" fill=\"#7C3AED\" rx=\"6\"/><text x=\"260\" y=\"22\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">菲德勒权变模型</text><text x=\"260\" y=\"55\" font-size=\"9.5\" fill=\"#6D28D9\" text-ancho =\"#0F2C4A\" font-family=\"Microsoft YaHei\">📌 现代领导力新视角</text><text x=\"20\" y=\"167\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">🔄 <b>交易型领导</b>：明确期望→绩效换报酬（绩效工资/奖金）</text><text x=\"20\" y=\"186\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">🌟 <b>变革型领导</b>：愿景激励→智力激发→个性化关怀→鼓舞激励（更高层次）</text><text x=\"20\" y=\"205\" font-size=\"9.5\" fill=\"#334155\" font-family=\"Microsoft YaHei\">🤝 <b>仆人式领导</b>：优先服务团队需求→建立信任→共同决策</text><text x=\"20\" y=\"222\" font-size=\"9\" fill=\"#64748B\" font-family=\"Microsoft YaHei\">启示：没有\"最好\"的领导风格，情境、任务性质和下属特征共同决定哪种风格最有效</text></svg><div class=\"diagram-caption\">领导理论演进：从固定风格→权变匹配→高质量交换关系，情境适应性是关键</div></div>"}},{"id":"mba-situation-leadership","module":"mba","category":"组织行为","title":"情境领导理论","subtitle":"下属成熟度与领导风格匹配","type":"model","situation":"people","source":"MBA组织行为学","icon":"🎭","tags":["情境领导","成熟度","授权"],"description":"情境领导理论根据下属的成熟度将领导风格分为指挥、教练、支持、授权四种，帮助领导者灵活调整风格。","details":{"readiness":[{"level":"R1","name":"低成熟度","desc":"能力低 + 意愿高：新人"},{"level":"R2","name":"中低成熟度","desc":"能力中等 + 意愿低"},{"level":"R3","name":"中高成熟度","desc":"能力较高 + 意愿不稳定"},{"level":"R4","name":"高成熟度","desc":"能力高 + 意愿高：独立完成"}],"styles":[{"style":"S1 指挥式","leadership":"高任务+低关系","desc":"领导者决定做什么，如何做"},{"style":"S2 教练式","leadership":"高任务+高关系","desc":"领导者解释决策，鼓励下属"},{"style":"S3 支持式","leadership":"低任务+高关系","desc":"领导者与下属共同讨论"},{"style":"S4 授权式","leadership":"低任务+低关系","desc":"领导者提供资源，下属自主决策"}],"steps":[{"n":"勒温","title":"勒温领导风格","desc":"专制型：决策集中，下属执行 | 民主型：成员参与讨论决策 | 放任型：给予充分自由，几乎不指导。研究：民主型领导效果最好（但效率可能较低）","color":"blue"},{"n":"菲德勒","title":"菲德勒权变模型","desc":"领导风格：任务导向 vs 关系导向（由LPC量表测定）。情境因素：领导者-成员关系、任务结构、职位权力。匹配：任务导向在极端情境（很好/很差）下更有效","color":"purple"},{"n":"情景","title":"情景领导理论 Hersey-Blanchard","desc":"领导风格应与下属成熟度匹配：S1指挥式（低成熟）→S2教练式→S3参与式→S4授权式（高成熟）。成熟度：工作成熟度+心理成熟度","color":"green"},{"n":"LMX","title":"LMX领导-成员交换","desc":"领导者与不同下属建立不同质量的关系：内群体（高质量交换：信任、尊重、互惠）vs 外群体（低质量交换：合同式关系）","color":"orange"}],"tips":"没有'最好'的领导风格，只有'最适合'的领导风格。菲德勒提醒我们先了解自己的领导风格，再选择匹配的情境。情景领导则告诉我们要根据下属的发展阶段调整领导方式。","detail":"领导理论经历了从特质论（领导有某些特质）→行为论（领导有某些行为模式）→权变论（领导效果取决于情境）的演进。现代领导理论还包括了交易型领导、变革型领导、仆人式领导等多种视角。","related":["激励理论","团队理论","组织变革"],"diagram":"<div class=\"diagram-wrap\"><svg viewBox=\"0 0 700 240\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"5\" width=\"165\" height=\"100\" fill=\"#EFF6FF\" stroke=\"#2563EB\" stroke-width=\"1.5\" rx=\"6\"/><rect x=\"5\" y=\"5\" width=\"165\" height=\"28\" fill=\"#2563EB\" rx=\"6\"/><text x=\"87\" y=\"22\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">勒温领导风格</text><text x=\"87\" y=\"55\" font-size=\"9.5\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">专制型：决策集中</text><text x=\"87\" y=\"72\" font-size=\"9.5\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">民主型：成员参与</text><text x=\"87\" y=\"89\" font-size=\"9.5\" fill=\"#1D4ED8\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">放任型：充分自由</text><rect x=\"178\" y=\"5\" width=\"165\" height=\"100\" fill=\"#F5F3FF\" stroke=\"#7C3AED\" stroke-width=\"1.5\" rx=\"6\"/><rect x=\"178\" y=\"5\" width=\"165\" height=\"28\" fill=\"#7C3AED\" rx=\"6\"/><text x=\"260\" y=\"22\" font-size=\"10\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">菲德勒权变模型</text><text x=\"260\" y=\"55\" font-size=\"9.5\" fill=\"#6D28D9\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">任务导向 vs 关系导向</text><text x=\"260\" y=\"72\" font-size=\"9.5\" fill=\"#6D28D9\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">好情境→任务导向更有效</text><text x=\"260\" y=\"89\" font-size=\"9.5\" fill=\"#6D28D9\" text-anchor=\"middle\" font-family=\"Microsoft YaHei\">差情境→关系导向更有效</text><rect x=\"351\" y=\"5\" width=\"165\" height=\"100\" fill=\"#F0FDF4\" stroke=\"#16A34A\" stroke-width=\"1.5\" rx=\"6\"/><rect x=\"351\" y=\"5\" width=\"165\" height=\"28\" fill=\"#16A34A\" rx=\"6\"/><text x=\"433\" y=\"22\" font-siz \"最好\"的领导风格，情境、任务性质和下属特征共同决定哪种风格最有效</text></svg><div class=\"diagram-caption\">领导理论演进：从固定风格→权变匹配→高质量交换关系，情境适应性是关键</div></div>"}},{"id":"mba-competency","module":"mba","category":"人力资源","title":"胜任力模型","subtitle":"岗位胜任力与人才评估","type":"model","situation":"people","source":"MBA人力资源管理","icon":"🏆","tags":["胜任力","人才评估","冰山模型"],"description":"胜任力模型是岗位所需知识、技能、能力的标准化描述，冰山模型揭示了显性胜任力与隐性胜任力的差异。","details":{"iceBerg":[{"name":"冰山之上","items":["知识：特定领域的专业信息","技能：完成某项任务的能力"]},{"name":"冰山之下","items":["社会角色、自我认知","特质、动机"]}],"framework":[{"name":"鉴别性胜任力","desc":"区分优秀绩效者和普通绩效者的特征"},{"name":"基准性胜任力","desc":"对岗位员工的基本要求"}],"steps":[{"n":"冰上","title":"冰山之上（显性）","desc":"知识 Knowledge：某一领域的事实和信息（容易观察和培养）| 技能 Skill：完成某项任务的能力（可观察和衡量）","color":"blue"},{"n":"冰下","title":"冰山之下（隐性）","desc":"自我概念：态度、价值观、自我认知 | 特质：稳定的个人特征（内向/外向）| 动机：内在持续驱动力的趋向","color":"purple"},{"n":"区分","title":"绩效区分力","desc":"浅层胜任力（知识/技能）：区分绩效一般和优秀者的贡献仅约30-40% | 深层胜任力（自我概念/特质/动机）：区分绩效平庸和卓越者的关键","color":"orange"},{"n":"应用","title":"应用场景","desc":"招聘选拔：识别关键胜任力，设计行为面试题 | 人才培养：针对差距设计发展计划 | 绩效评估：将胜任力作为评价维度之一","color":"green"}],"tips":"胜任力模型的构建应基于对高绩效者的行为事件访谈(BEI)，而非管理者的主观判断。只有能区分高绩效和一般绩效的特质才是真正的'胜任力'。","detail":"胜任力冰山模型由戴维·麦克利兰(David McClelland)于1973年提出，核心观点是：传统智力和知识测试无法预测工作绩效，真正区分优秀者和平庸者的是深层动机、特质和自我概念。","related":["HR选用育留","OKR_KPI","领导理论"]}},{"id":"mba-lean-startup","module":"mba","category":"创业管理","title":"精益创业方法论","subtitle":"构建-测量-学习反馈循环","type":"method","situation":"optimization","source":"MBA创业管理与创新","icon":"🚀","tags":["精益创业","MVP","快速验证"],"description":"精益创业核心是用最小可行产品(MVP)快速验证假设，通过构建-测量-学习的反馈循环迭代产品。","details":{"build":[{"name":"构建","desc":"用最小可行产品(MVP)快速推出核心功能"},{"name":"MVP","desc":"满足早期用户核心需求的最简化产品"}],"measure":[{"name":"测量","desc":"用数据验证假设，而非依赖主观判断"}],"learn":[{"name":"学习","desc":"从数据中提取洞察，判断是否Pivot还是坚持"}],"steps":[{"n":"MVP","title":"最小可行产品 MVP","desc":"用最小时间和成本开发最简产品版本，只包含核心假设的验证功能。不是'半成品'，而是'学习工具'","color":"green"},{"n":"问题","title":"用户问题匹配","desc":"在开发产品之前，先验证用户是否真的有这个问题。走出办公室，与真实用户交谈。无效假设的早期失败比晚期失败好100倍","color":"blue"},{"n":"方案","title":"解决方案匹配","desc":"用原型/演示验证用户是否愿意为解决方案付费。关键指标：用户使用频率、是否主动推荐、是否愿意预付款","color":"purple"},{"n":"渠道","title":"渠道匹配","desc":"验证用户通过什么渠道找到你的产品。低成本获客渠道测试，找到有效渠道后规模化","color":"orange"}],"tips":"精益创业的核心是'快速验证假设'而非'完美执行计划'。很多创业者死于'构建-测量-学习'循环太慢。最小化可行产品（MVP）的原则是：只构建绝对必要的功能，其他等验证后再加。","detail":"精益创业由埃里克·莱斯(Eric Ries)在《精益创业》中提出，核心理念来自精益生产：消除浪费、加快迭代、数据驱动。精益创业反对'先计划再执行'的传统方法，倡导'走出办公室、在实践中学习'的创业方法论。","formula":"精益创业反馈循环：\n构建(Build) → 测量(Measure) → 学习(Learn) → 循环\n\nMVP检验的不是'产品是否完整'，而是'核心假设是否成立'","related":["德鲁克创新","第一性原理","商业模式画布"]}},{"id":"m360-001","module":"m360","category":"精益制造","title":"精益屋与丰田生产系统","subtitle":"精益体系基础框架","type":"method","situation":"optimization","source":"M360精益制造","icon":"🏠","tags":["精益生产","TPS","丰田生产系统","价值创造"],"description":"精益屋是精益制造体系的视觉化表达，屋顶是目标（高质量、低成本、短交期），地基是持续改善，两大支柱是准时化与自働化。","details":{"roof":["高质量","低成本","短交期"],"pillars":["JIT 准时化","Jidoka 自働化"],"foundation":["改善（Kaizen）","标准化（Standardized Work）","现场主义（Gemba）"]}},{"id":"m360-002","module":"m360","category":"精益制造","title":"OEE设备综合效率","subtitle":"设备效率管理与损失分析","type":"method","situation":"optimization","source":"M360精益制造","icon":"⚙️","tags":["OEE","设备效率","可用性","性能","质量"],"description":"OEE是衡量设备效率的核心指标，等于可用率、性能率、质量率三者的乘积。","details":{"formula":"OEE = 可用率 × 性能率 × 质量率","losses":["设备当机","换线调试","小停机","速度降低","不良品","返工"]}},{"id":"m360-003","module":"m360","category":"精益制造","title":"SMED快速换模","subtitle":"缩短换线时间提升效率","type":"method","situation":"optimization","source":"M360精益制造","icon":"⏱️","tags":["SMED","快速换模","减少停机","柔性生产"],"description":"SMED将换线时间分为内部换线（停机时才能做）和外部换线（可在生产中做），通过将内部换线转为外部换线来缩短总换线时间。","details":{"steps":[{"step":"1","name":"区分内部与外部换线","desc":"记录当前换线步骤，区分哪些必须在停机时做"},{"step":"2","name":"将内部换线转为外部","desc":"提前准备工具、预热设备、并行化操作"},{"step":"3","name":"优化所有换线步骤","desc":"消除浪费动作，标准化操作顺序"}]}},{"id":"m360-004","module":"m360","category":"精益制造","title":"VSM价值流图","subtitle":"现状图与未来状态设计","type":"tool","situation":"optimization","source":"M360精益制造","icon":"📊","tags":["VSM","MIFA","价值流图","精益改善"],"description":"VSM是系统性地识别和消除价值流中浪费的工具，通过现状图识别问题，设计未来状态图规划改善路径。","details":{"icons":["进程箱","库存三角","送货卡车","改善箭头"],"timeline":["增值时间","前置时间","交付周期"]}},{"id":"m360-005","module":"m360","category":"精益制造","title":"A3问题解决法","subtitle":"结构化问题分析与报告","type":"tool","situation":"optimization","source":"M360精益制造","icon":"📄","tags":["问题解决","5Why","鱼骨图","PDCA"],"description":"A3是一种结构化的问题解决报告方法，将问题的背景、分析、对策、执行计划浓缩在一张A3纸上，促进目视化管理。","details":{"sections":["背景/问题描述","目标状态","现状分析(5Why)","对策计划","执行跟踪","结果验证"]}},{"id":"m360-006","module":"m360","category":"精益制造","title":"标准化作业","subtitle":"最佳实践固化与传承","type":"process","situation":"optimization","source":"M360精益制造","icon":"📋","tags":["标准化作业","节拍时间","标准在制品","SOP"],"description":"标准化作业是改善的基础，通过设定标准时间、标准在制品、标准作业顺序，让任何人都能以最佳方式执行任务。","details":{"elements":["节拍时间","标准作业顺序","标准在制品","作业者工程分析"]}},{"id":"m360-007","module":"m360","category":"精益制造","title":"目视化管理","subtitle":"现场状态一目了然","type":"method","situation":"optimization","source":"M360精益制造","icon":"👁️","tags":["目视化管理","可视化","异常管理","现场管理"],"description":"目视化管理通过标识、颜色、图表等手段让现场状态一目了然，任何人都能立即判断正常还是异常。","details":{"principles":["状态一眼可知","异常立即显现","无需说明即可理解"],"examples":["红黄绿信号灯","进度看板","KANBAN卡","标准作业板"]}},{"id":"m360-008","module":"m360","category":"精益制造","title":"IE动作分析","subtitle":"取消不增值的浪费动作","type":"method","situation":"optimization","source":"M360精益制造","icon":"🏃","tags":["VA","NVA","UPPH","线平衡","效率提升"],"description":"IE动作分析通过区分增值动作(VA)和非增值动作(NVA)，消除浪费，提高作业效率。","details":{"principles":["减少动作数量","缩短移动距离","同时进行双手动作","减少不自然姿势"],"tools":["动作经济原则","双手作业分析","流程程序分析","线平衡图"]}},{"id":"m360-009","module":"m360","category":"精益制造","title":"TPM全面生产维护","subtitle":"设备故障零化与维护","type":"method","situation":"optimization","source":"M360精益制造","icon":"🔧","tags":["维修策略","TBM","CBM","FMEA","MTBF","MTTR"],"description":"TPM通过全员参与的设备维护活动，追求零故障、零缺陷、零事故，提高设备综合效率。","details":{"pillars":["自主维护","计划维护","个别改善","早期管理","教育训练","健康管理"],"metrics":["MTBF 平均故障间隔","MTTR 平均修复时间","OEE 设备综合效率"]}},{"id":"m360-010","module":"m360","category":"精益制造","title":"绩效管理与日常对话","subtitle":"分层沟通与持续改进","type":"process","situation":"people","source":"M360精益制造","icon":"📈","tags":["业绩管理","KPI","分层对话","目视化管理"],"description":"绩效管理通过日常对话、每周回顾、每月总结的分层沟通机制，确保目标对齐和问题及时解决。","details":{"cadences":["每日Check-in/Check-out","每周业务回顾","每月绩效面谈","季度战略复盘"],"elements":["目标设定","进度跟踪","问题升级","改进认可"]}},{"id":"m360-011","module":"m360","category":"精益制造","title":"领导力与精益变革","subtitle":"精益文化建设的关键","type":"concept","situation":"people","source":"M360精益制造","icon":"👑","tags":["领导力","精益文化","变革管理","教练技术"],"description":"精益成功取决于领导者的行为和承诺，包括现场走访（Gemba Walk）、教练式提问、示范最佳实践。","details":{"leaderBehaviors":["Gemba Walk 现场走访","教练式提问","示范标准作业","认可和激励改善"],"changeModel":["准备-诊断-设计-实施-固化"]}},{"id":"m360-012","module":"m360","category":"精益制造","title":"战略部署与日常管理","subtitle":"目标分解与执行追踪","type":"process","situation":"optimization","source":"M360精益制造","icon":"🎯","tags":["战略部署","Hoshin Kanri","目标管理","日常管理"],"description":"战略部署通过长期愿景分解为年度目标，层层落实到部门和个人，确保上下对齐并持续追踪。","details":{"steps":["建立长期愿景","三年/年度目标","部门目标分解","个人行动计划","月度追踪","年度复盘"]}},{"id":"m360-013","module":"m360","category":"精益制造","title":"倾听员工意见","subtitle":"一线智慧挖掘与激励","type":"process","situation":"people","source":"M360精益制造","icon":"👂","tags":["倾听技巧","员工参与","改善提案","尊重人性"],"description":"精益强调尊重员工智慧，通过各种机制让一线员工参与改善，包括改善提案、Kaizen小组、合理化建议。","details":{"mechanisms":["改善提案制度","Kaizen Event","QC小组","一对一谈话","全员改善"],"principles":["不惩罚提出问题的人","鼓励小规模实验","认可改善贡献"]}},{"id":"opr-001","module":"opr","category":"流程优化","title":"OPR流程成熟度模型","subtitle":"流程成熟度评估框架","type":"model","situation":"internal","source":"OPR流程优化","icon":"📊","tags":["OPR","流程评估","八大元素","流程成熟度"],"description":"OPR通过八个维度评估企业流程成熟度，从混乱级到最优级共五级，帮助企业识别改进方向。","details":{"levels":["L1 混乱级","L2 功能级","L3 流程级","L4 控制级","L5 优化级"],"dimensions":["顾客满意","质量","效率","成本","交付","安全","士气","创新"]}},{"id":"opr-002","module":"opr","category":"流程优化","title":"5Why根因分析","subtitle":"追本溯源找到真因","type":"tool","situation":"optimization","source":"OPR流程优化","icon":"❓","tags":["5Why             sidebar.classList.add('open');

            overlay.classList.add('show');

            sidebar.classList.remove('open');
            overlay.classList.remove('show');
            toggle.classList.remove('active');

        if (toggle && sidebar && overlay) {
            toggle.addEventListener('click', function() {
                if (sidebar.classList.contains('open')) {
                    closeSidebar();

                    openSidebar();

    // ==================== 筛选逻辑 ====================
    function setFilter(key, value) {
        // 每次只保留当前维度的筛选，重置其他维度（各自独立，互不叠加）
        currentFilter.module = 'all';
        currentFilter.situation = 'all';
        currentFilter.category = 'all';
        currentFilter.type = 'all';
        currentFilter[key] = value;

        // 找到当前点击的 nav-item（通过 onclick 属性匹配，避免依赖 event.target）
        const sectionMap = { module: '#nav-modules', situation: '#nav-situations', category: '#nav-categories' };
        const sectionId = sectionMap[key];
        let clickedItem = null;
        if (sectionId) {
            document.querySelectorAll(sectionId + ' .nav-item').forEach(item => {
                if (item.getAttribute('onclick').includes("'" + value + "'")) clickedItem = item;
            });
        }

        // 重置所有维度的选中态
        document.querySelectorAll('#nav-modules .nav-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('#nav-situations .nav-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('#nav-categories .nav-item').forEach(el => el.classList.remove('active'));

        // 只激活当前点击的项
        if (clickedItem) clickedItem.classList.add('active');

        document.getElementById('filterSituation').value = currentFilter.situation;
        renderCards();
        updateStats();
    }

    function filterContent() {
        currentFilter.situation = document.getElementById('filterSituation').value;
        currentFilter.type = document.getElementById('filterType').value;
        currentFilter.search = document.getElementById('searchInput').value;
        renderCards();
        updateStats();
    }

    // ==================== 渲染卡片 ====================
    function renderCards() {
        const grid = document.getElementById('cardsGrid');
        const emptyState = document.getElementById('emptyState');
        
        let filtered = KNOWLEDGE_BASE.filter(item => {
            if (currentFilter.module !== 'all' && item.module !== currentFilter.module) return false;
            if (currentFilter.situation !== 'all' && item.situation !== 'all' && item.situation !== currentFilter.situation) return false;
            if (currentFilter.category !== 'all' && item.category !== currentFilter.category) return false;
            if (currentFilter.type !== 'all' && item.type !== currentFilter.type) return false;
            if (currentFilter.search) {
                const s = currentFilter.search.toLowerCase();
                if (!item.title.toLowerCase().includes(s) && 
                    !item.description.toLowerCase().includes(s) &&
                    !item.tags.some(t => t.toLowerCase().includes(s))) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '';
            emptyState.style.display = 'flex';
        } else {
            emptyState.style.display = 'none';
            grid.innerHTML = filtered.map(item => `
                <div class="card ${item.module}" onclick="showDetail('${item.id}')">
                    <span class="card-badge ${item.module}">${getModuleName(item.module)}</span>
                    <div class="card-title-row">
                        <span class="card-icon">${item.icon}</span>
                        <h3 class="card-title">${item.title}</h3>
                    </div>
                    <div class="card-source">📖 ${(item.subtitle || item.description || item.source).substring(0, 42)}${(item.subtitle || item.description || '').length > 42 ? '…' : ''}</div>
                    <p class="card-desc">${item.description}</p>
                    <div class="card-footer">
                        <div class="card-tags-row">
                            <span class="card-tag tag-${item.situation}">${getSituationName(item.situation)}</span>
                            ${(item.tags || []).slice(0, 2).map(t => `<span class="card-tag" style="background:#f1f5f9;color:#475569">${t}</span>`).join('')}
                        </div>
                        <button class="card-pdf-btn" onclick="event.stopPropagation();downloadItemPDF('${item.id}')" title="下载此方法 PDF">
                            📥 PDF
                        </button>
                    </div>
                </div>
            `).join('');
        }
    }

    function getModuleName(m) {
        const n = {mba:'企业战略', m360:'精益制造', opr:'流程改进', purchase:'采购供应', moh:'成本会计'};
        return n[m] || m;

    function getTypeName(type) {
        const names = {method: '方法论', model: '分析模型', process: '流程步骤', tool: '工具模板', concept: '核心概念'};
        return names[type] || type;

    function getSituationName(s) {
        const m = {external:'外部优化', internal:'内部优化', optimization:'流程改进', people:'人员组织', all:'通用'};
        return m[s] || s;
    }

    function showDetail(id) {
        const item = KNOWLEDGE_BASE.find(i => i.id === id);
        if (!item) return;

        const moduleColors = {mba:'#2563EB',m360:'#16A34A',opr:'#D97706',purchase:'#7C3AED',moh:'#DC2626'};
        const accentColor = moduleColors[item.module] || '#2563EB';

        let detailsHtml = '';
        if (item.details) {
            const fieldOrder = ['steps','formula','tips','definition','detail','quadrants','dimensions','criteria','components','elements','allocation','process','types','impacts','functions','related','costStructure','diagram'];
            fieldOrder.forEach(k => {
                const v = item.details[k];
                if (v === undefined) return;
                if (k === 'steps' && Array.isArray(v)) {
                    const stepsHtml = v.map((s, i) => {
                        const colors = ['#16A34A','#D97706','#7C3AED','#0891B2'];
                        const c = colors[i % colors.length];
                        const n = s.n || (i+1);
                        return '<div class="step-item"><div class="step-num" style="background:'+c+'">'+n+'</div><div class="step-text"><strong>'+(s.title||'')+'</strong><p>'+(s.desc||'')+'</p></div></div>';
                    }).join('');
                    detailsHtml += '<div class="modal-section-title">📋 执行步骤</div><div class="step-flow">'+stepsHtml+'</div>';
                } else if (k === 'formula' && typeof v === 'string') {
                    detailsHtml += '<div class="modal-section-title">📐 核心公式</div><div class="modal-formula">'+v.replace(/\n/g,'<br>')+'</div>';
                } else if (k === 'tips' && typeof v === 'string') {
                    detailsHtml += '<div class="modal-tip">💡 '+v+'</div>';
                } else if (k === 'detail' && typeof v === 'string') {
                    detailsHtml += '<div class="modal-section-title">🔍 深度解读</div><div class="modal-depth">'+v+'</div>';
                } else if (k === 'related' && Array.isArray(v)) {
                    const tagsHtml = v.map(r => '<span class="tag-item" style="background:'+accentColor+'20;color:'+accentColor+';border:1px solid '+accentColor+'40">'+r+'</span>').join('');
                    detailsHtml += '<div class="modal-section-title">🔗 相关方法</div><div class="modal-tags">'+tagsHtml+'</div>';
                } else if (k === 'costStructure' && typeof v === 'string') {
                    detailsHtml += '<div class="modal-section-title">💰 成本结构</div><div class="modal-formula">'+v.replace(/\n/g,'<br>')+'</div>';
                } else if (k === 'definition' && typeof v === 'string') {
                    detailsHtml += '<div class="modal-section-title">📖 核心定义</div><div class="modal-depth">'+v+'</div>';
                } else if (k === 'diagram' && typeof v === 'string') {
                    detailsHtml += '<div class="modal-section-title">📊 图形展示</div><div class="modal-diagram">'+v+'</div>';
                } else if (Array.isArray(v)) {
                    const isStructured = v.length > 0 && typeof v[0] === 'object' && (v[0].name || v[0].criteria || v[0].items);
                    let sectionName = '';
                    if (k === 'dimensions' || k === 'quadrants') sectionName = '📊 分析维度';
                    else if (k === 'criteria') sectionName = '📋 评估维度';
                    else if (k === 'components' || k === 'elements') sectionName = '🏗️ 构成要素';
                    else if (k === 'process') sectionName = '🔄 执行流程';
                    else if (k === 'types') sectionName = '📂 类型分类';
                    else if (k === 'impacts') sectionName = '⚠️ 影响事项';
                    else if (k === 'functions') sectionName = '⚙️ 功能模块';
                    else sectionName = '📌 ' + k;
                    if (isStructured) {
                        const gridHtml = v.map(i => {
                            const title = i.name || i.criteria || i.label || '';
                            const items = i.items || i.desc || '';
                            if (Array.isArray(items)) {
                                return '<div class="modal-grid-item"><div class="modal-grid-item-title">'+title+'</div><ul>'+items.map(it=>'<li>'+it+'</li>').join('')+'</ul></div>';
                            } else {
                                return '<div class="modal-grid-item"><div class="modal-grid-item-title">'+title+'</div><p>'+items+'</p></div>';
                            }
                        }).join('');
                        detailsHtml += '<div class="modal-section-title">'+sectionName+'</div><div class="modal-grid">'+gridHtml+'</div>';
                    } else {
                        detailsHtml += '<div class="modal-section-title">'+sectionName+'</div><ul>'+v.map(i=>'<li>'+(typeof i==='object'?JSON.stringify(i):i)+'</li>').join('')+'</ul>';
                    }
                } else if (typeof v === 'string' && (v.includes('=') || v.includes('+'))) {
                    detailsHtml += '<div class="modal-section-title">'+k+'</div><div class="modal-formula">'+v.replace(/\n/g,'<br>')+'</div>';
                }
            });
            Object.entries(item.details).forEach(([k, v]) => {
                if (fieldOrder.map(f=>f.toLowerCase()).includes(k.toLowerCase())) return;
                if (v === undefined || v === null) return;
                if (typeof v === 'string') {
                    detailsHtml += '<div class="modal-section-title">'+k+'</div><div class="modal-depth">'+v+'</div>';
                }
            });
        }

        const situationLabel = getSituationName(item.situation) || '';
        const typeLabel = getTypeName(item.type) || item.type || '';
        const catLabel = item.category || '';

        const modal = document.getElementById('modalOverlay');
        window.currentModalItemId = item.id;
        const headerAccent = modal.querySelector('.modal-accent');
        const headerTitle = modal.querySelector('.modal-title');
        const bodyContent = modal.querySelector('.modal-body .modal-content');
        if (headerAccent) headerAccent.style.background = accentColor;
        if (headerTitle) headerTitle.textContent = item.icon + ' ' + item.title;
        if (bodyContent) {
            bodyContent.innerHTML = '<div class="modal-meta">' +
                '<span class="modal-meta-badge" style="background:'+accentColor+'15;color:'+accentColor+';border-color:'+accentColor+'40">'+typeLabel+'</span>' +
                (catLabel ? '<span class="modal-meta-badge">'+catLabel+'</span>' : '') +
                '<span class="modal-meta-badge">'+situationLabel+'</span>' +
            '</div>' +
            '<div class="modal-desc">'+(item.description||'')+'</div>' +
            detailsHtml +
            (item.source ? '<div class="modal-section-title">📚 来源课程</div><div class="modal-source">'+item.source+'</div>' : '');
        }
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    // 获取字段的中文标题
    function getFieldLabel(key) {
        return FIELD_LABELS[key] || ('📌 ' + key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase()));
    }

    // 判断数组项是否为结构化对象（有name/criteria/desc/items等）
    function isStructuredItem(item) {
        return item && typeof item === 'object' && (item.name !== undefined || item.criteria !== undefined || item.desc !== undefined || item.items !== undefined || item.level !== undefined || item.style !== undefined || item.letter !== undefined);
    }

    // 判断数组项是否为结构化数组
    function isStructuredArray(arr) {
        return Array.isArray(arr) && arr.length > 0 && isStructuredItem(arr[0]);
    }

    // 渲染结构化数组（对象数组，如dimensions/criteria/components等）
    function renderStructuredArray(arr, sectionName, accentColor) {
        const gridHtml = arr.map(item => {
            let title = item.name || item.criteria || item.label || item.level || item.style || item.letter || item.desc || '';
            // 权重/描述处理
            let subtitle = item.weight ? `（权重: ${item.weight}）` : '';
            let desc = item.desc || '';
            // items处理
            let itemsHtml = '';
            if (Array.isArray(item.items) && item.items.length > 0) {
                itemsHtml = item.items.map(it => `<li style="margin:3px 0">${it}</li>`).join('');
                itemsHtml = `<ul style="font-size:12px;color:#475569;line-height:1.7;padding-left:16px;margin-top:6px">${itemsHtml}</ul>`;
            }
            if (typeof item.items === 'string' && item.items) {
                itemsHtml = `<p style="font-size:12px;color:#64748b;margin-top:4px">${item.items}</p>`;
            }
            const titleHtml = title ? `<div style="font-weight:bold;color:#1e3a5f;font-size:13px;margin-bottom:4px">${title}${subtitle ? '<span style="font-weight:normal;color:#64748b;font-size:11px;margin-left:6px">'+subtitle+'</span>' : ''}</div>` : '';
            const descHtml = desc ? `<p style="font-size:12px;color:#475569;margin-top:4px;line-height:1.6">${desc}</p>` : '';
            return `<div style="flex:1;min-width:180px;background:#fafbfc;border:1px solid #e2e8f0;border-radius:8px;padding:12px">
                ${titleHtml}${descHtml}${itemsHtml}
            </div>`;
        }).join('');
        return `<div style="margin:16px 0">
            <div style="font-size:15px;font-weight:bold;color:#1e3a5f;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid ${accentColor}">${sectionName}</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">${gridHtml}</div>
        </div>`;
    }

    // 渲染简单字符串数组（如roof/pillars/foundation等）
    function renderSimpleArray(arr, sectionName) {
        return `<div style="margin:16px 0">
            <div style="font-size:15px;font-weight:bold;color:#1e3a5f;margin-bottom:10px">${sectionName}</div>
            <ul style="font-size:13px;color:#475569;line-height:1.8;padding-left:20px">${arr.map(i => `<li style="margin:4px 0">${i}</li>`).join('')}</ul>
        </div>`;
    }

    function renderSteps(steps, sectionName, accentColor) {

        const priorityKeysSet = new Set(priorityKeys);

        const keys = Object.keys(item.details);

        // 固定顺序
        const priorityKeys = ['steps','formula','tips','definition','detail','related','diagram'];
        const priorityKeysSet = new Set(priorityKeys);
        const remainingKeys = keys.filter(k => !priorityKeysSet.has(k));
        const orderedKeys = [...priorityKeys.filter(k => keys.includes(k)), ...remainingKeys];

        orderedKeys.forEach(k => {
            const v = item.details[k];
            if (v === undefined || v === null) return;
            const label = getFieldLabel(k);

            if (k === 'steps' && Array.isArray(v)) {
                lines.push({ label, text: '' });
                v.forEach((s, i) => {
                    if (typeof s === 'string') {
                        // 字符串格式步骤：直接显示内容
                        lines.push({ label: `  ${i+1}.`, text: s });
                    } else {
                        // 结构化对象格式：{n, title, desc}
                        const n = s.n || (i+1);
                        const title = s.title || '';
                        const desc = s.desc || '';
                        lines.push({ label: `  ${n}.`, text: title + (desc ? '：' + desc : '') });
                    }
                });
            } else if (isStructuredArray(v)) {
                // 结构化对象数组
                lines.push({ label, text: '' });
                v.forEach(row => {
                    const title = row.name || row.criteria || row.label || row.level || row.style || row.letter || row.desc || '';
                    const items = Array.isArray(row.items) ? row.items.join('、') : (row.desc || '');
                    const weight = row.weight ? `（权重: ${row.weight}）` : '';
                    if (title) lines.push({ label: '  ▪', text: title + weight + (items ? '：' + items : '') });
                });
            } else if (Array.isArray(v) && v.length > 0 && typeof v[0] === 'string') {
                lines.push({ label, text: v.join('、') });
            } else if (typeof v === 'string') {
                lines.push({ label, text: v });
            }
        });
        return lines;
    }

    function downloadPPT(scope) {
        const loading = document.getElementById('downloadLoading');
        const msg = document.getElementById('downloadMsg');

        const items = scope === 'all' ? KNOWLEDGE_BASE :
            KNOWLEDGE_BASE.filter(i => i.module === scope);
        const moduleName = scope === 'all' ? '综合知识库' : (MODULE_NAMES[scope] || scope);
        const total = items.length;

        loading.classList.add('show');
        msg.textContent = '正在生成 PPT（' + total + ' 张幻灯片）...';

        function generatePPT() {
            const PptxGen = window.PptxGenJS;
            const ppt = new PptxGen();
            ppt.layout = 'LAYOUT_WIDE';
            ppt.title = moduleName;
            ppt.author = '综合知识库';
            const color = MODULE_COLORS[scope] || '2563EB';

            // 封面页
            const slide = ppt.addSlide();
            slide.addText(moduleName, { x: 0.5, y: 2.5, w: 12.5, h: 1.2, fontSize: 40, bold: true, color: '1E3A5F', align: 'center' });
            slide.addText('综合知识库 · 共 ' + total + ' 条知识方法论', { x: 0.5, y: 3.8, w: 12.5, h: 0.6, fontSize: 20, color: '64748B', align: 'center' });
            slide.addShape(ppt.ShapeType.rect, { x: 5.5, y: 4.6, w: 2, h: 0.08, fill: { color: color } });
            slide.addText('📚', { x: 5.5, y: 1.8, w: 2, h: 0.8, fontSize: 48, align: 'center' });

            // 每条一页
            items.forEach((item, idx) => {
                const s = ppt.addSlide();
                s.background = { color: 'F8FAFC' };

                // 顶部色块
                s.addShape(ppt.ShapeType.rect, { x: 0, y: 0, w: 13.33, h: 0.9, fill: { color: color } });
                s.addText(item.icon + ' ' + item.title, { x: 0.4, y: 0.15, w: 12, h: 0.6, fontSize: 24, bold: true, color: 'FFFFFF' });

                // 元信息行
                const typeLabel = getTypeName(item.type) || '';
                const sitLabel = getSituationName(item.situation) || '';
                const catLabel = item.category || '';
                s.addText([
                    { text: typeLabel, options: { bold: true, color: color } },
                    { text: '  |  ', options: { color: 'CBD5E1' } },
                    { text: sitLabel, options: { color: '64748B' } },
                    { text: '  |  ', options: { color: 'CBD5E1' } },
                    { text: catLabel, options: { color: '64748B' } }
                ], { x: 0.5, y: 1.1, w: 12, h: 0.4, fontSize: 13 });

                // 描述
                if (item.description) {
                    s.addText(item.description, { x: 0.5, y: 1.6, w: 12.3, h: 0.9, fontSize: 14, color: '334155', valign: 'top' });
                }

                // 详情内容（统一格式）
                const detailLines = buildDetailsText(item);
                let yPos = 2.6;
                detailLines.forEach(line => {
                    if (yPos > 6.5) return;
                    if (line.text === '') {
                        // 空行=小节标题
                        s.addText(line.label, { x: 0.5, y: yPos, w: 12, h: 0.3, fontSize: 11, bold: true, color: color });
                        yPos += 0.35;
                    } else if (line.label.startsWith('  ')) {
                        // 缩进=子项
                        s.addText(line.label, { x: 0.5, y: yPos, w: 0.5, h: 0.3, fontSize: 10, color: '64748B' });
                        s.addText(line.text, { x: 1.0, y: yPos, w: 11.8, h: 0.3, fontSize: 10, color: '475569', valign: 'top' });
                        yPos += 0.32;
                    } else {
                        // 正常=内容行
                        s.addText(line.label, { x: 0.5, y: yPos, w: 2, h: 0.3, fontSize: 11, bold: true, color: color });
                        s.addText(line.text, { x: 2.5, y: yPos, w: 10.3, h: 0.3, fontSize: 11, color: '475569', valign: 'top' });
                        yPos += 0.35;
                    }
                });

                // 页脚
                s.addText((idx + 1) + ' / ' + total, { x: 12, y: 7.1, w: 1, h: 0.3, fontSize: 10, color: '94A3B8', align: 'right' });
            });

            const filename = moduleName + '_知识库_' + total + '条.pptx';
            ppt.writeFile({ fileName: filename });
        }

        if (window.PptxGenJS) {
            pptLibLoaded = true;
            generatePPT();
            loading.classList.remove('show');
            return;
        }

        msg.textContent = '正在加载 PPT 生成库...';
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
        script.onload = () => {
            pptLibLoaded = true;
            msg.textContent = '正在生成 PPT（' + total + ' 张幻灯片）...';
            generatePPT();
            loading.classList.remove('show');
        };
        script.onerror = () => {
            loading.classList.remove('show');
            alert('PPT 生成失败，请检查网络连接后重试。\n（如需离线使用，可先在有网络的环境打开本文件）');
        };
        document.head.appendChild(script);
    }
    </script>
